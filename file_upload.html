<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload and Approval System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .file-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .file-item:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .status-approved {
            background-color: #d1e7dd;
            color: #0a3622;
            border: 1px solid #a3cfbb;
        }
        
        .status-rejected {
            background-color: #f8d7da;
            color: #58151c;
            border: 1px solid #f1aeb5;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .comments-section {
            background: #f8f9fa;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }
        
        .upload-progress {
            display: none;
        }
        
        /* Custom modal styles - using Bootstrap classes but jQuery functionality */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1050;
            overflow: auto;
        }
        
        .custom-modal.show {
            display: block !important;
        }
        
        .custom-modal .modal-content {
            background: white;
            border-radius: 8px;
            margin: 5% auto;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .modal-body {
            padding: 1rem;
        }
        
        .modal-footer {
            padding: 1rem;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        
        .btn-close {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        
        .btn-close:before {
            content: "×";
        }
        
        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4"><i class="fas fa-cloud-upload-alt"></i> File Upload and Approval System</h2>
                
                <!-- Alert Messages -->
                <div id="alertContainer"></div>
                
                <!-- Upload Section -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-folder-open"></i> File Management
                        </h5>
                        <button type="button" class="btn btn-primary" onclick="showModal('uploadModal')">
                            <i class="fas fa-plus-circle"></i> Upload Files
                        </button>
                    </div>
                </div>
                
                <!-- Files List Section -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-file-alt"></i> Uploaded Files
                        </h5>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="loadFiles()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="filesContainer">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p class="mb-0">Loading files...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- File Upload Modal -->
    <div class="custom-modal" id="uploadModal">
        <div class="modal-content" style="width: 600px;">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-upload"></i> Upload Files</h5>
                <button type="button" class="btn-close" onclick="hideModal('uploadModal')"></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Select Files</label>
                        <input type="file" class="form-control" id="fileInput" name="files" multiple 
                               accept=".txt,.pdf,.png,.jpg,.jpeg,.gif,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
                        <div class="form-text">
                            Supported: PDF, Images, Word, Excel, PowerPoint, Text files (Max: 50MB each)
                        </div>
                    </div>
                    
                    <div id="selectedFiles" class="mt-3" style="display: none;">
                        <h6>Selected Files:</h6>
                        <div id="filesList"></div>
                    </div>
                    
                    <div class="upload-progress" id="uploadProgress">
                        <div class="progress mt-3">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideModal('uploadModal')">Cancel</button>
                <button type="button" class="btn btn-secondary" onclick="clearSelection()">
                    <i class="fas fa-times-circle"></i> Clear
                </button>
                <button type="submit" form="uploadForm" class="btn btn-primary" id="uploadBtn">
                    <i class="fas fa-upload"></i> Upload Files
                </button>
            </div>
        </div>
    </div>

    <!-- Approval/Rejection Modal -->
    <div class="custom-modal" id="actionModal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h5 class="modal-title" id="actionModalTitle">File Action</h5>
                <button type="button" class="btn-close" onclick="hideModal('actionModal')"></button>
            </div>
            <div class="modal-body">
                <form id="actionForm">
                    <input type="hidden" id="actionFileId" name="file_id">
                    <input type="hidden" id="actionType" name="action_type">
                    
                    <div class="mb-3">
                        <label for="actionComments" class="form-label">Comments</label>
                        <textarea class="form-control" id="actionComments" name="comments" rows="3" 
                                  placeholder="Enter your comments..."></textarea>
                        <div class="form-text" id="commentsHelp">
                            Comments are optional for approval but required for rejection.
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideModal('actionModal')">Cancel</button>
                <button type="button" class="btn" id="actionSubmitBtn" onclick="submitAction()">Submit</button>
            </div>
        </div>
    </div>

    <!-- jQuery only (no Bootstrap JS needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    
    <script>
        $(document).ready(function() {
            loadFiles();
            setupFileUpload();
            setupCustomModals();
        });

        // Simple jQuery-based modal functionality
        function setupCustomModals() {
            // Close modal when clicking backdrop
            $('.custom-modal').on('click', function(e) {
                if (e.target === this) {
                    hideModal(this.id);
                }
            });
            
            // Handle ESC key
            $(document).on('keydown', function(e) {
                if (e.key === 'Escape') {
                    $('.custom-modal.show').each(function() {
                        hideModal(this.id);
                    });
                }
            });
        }

        function showModal(modalId) {
            $('#' + modalId).addClass('show');
            $('body').css('overflow', 'hidden'); // Prevent background scrolling
        }

        function hideModal(modalId) {
            $('#' + modalId).removeClass('show');
            $('body').css('overflow', ''); // Restore scrolling
            
            // Trigger cleanup event
            $('#' + modalId).trigger('modal-hidden');
        }

        function setupFileUpload() {
            const fileInput = document.getElementById('fileInput');
            
            // File input change handler
            fileInput.addEventListener('change', function() {
                displaySelectedFiles(this.files);
            });
            
            // Form submission
            $('#uploadForm').on('submit', function(e) {
                e.preventDefault();
                uploadFiles();
            });
            
            // Clear form when modal is hidden
            $('#uploadModal').on('modal-hidden', function() {
                document.getElementById('uploadForm').reset();
                clearSelection();
            });
        }

        function displaySelectedFiles(files) {
            const container = document.getElementById('selectedFiles');
            const filesList = document.getElementById('filesList');
            
            if (files.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            let html = '';
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const size = formatFileSize(file.size);
                html += `
                    <div class="d-flex align-items-center justify-content-between p-2 border rounded mb-2">
                        <div>
                            <i class="fas fa-file"></i>
                            <span class="ms-2">${file.name}</span>
                            <small class="text-muted ms-2">(${size})</small>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeFile(${i})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }
            
            filesList.innerHTML = html;
            container.style.display = 'block';
        }

        function removeFile(index) {
            const fileInput = document.getElementById('fileInput');
            const dt = new DataTransfer();
            
            for (let i = 0; i < fileInput.files.length; i++) {
                if (i !== index) {
                    dt.items.add(fileInput.files[i]);
                }
            }
            
            fileInput.files = dt.files;
            displaySelectedFiles(fileInput.files);
        }

        function clearSelection() {
            document.getElementById('fileInput').value = '';
            document.getElementById('selectedFiles').style.display = 'none';
        }

        function uploadFiles() {
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('uploadProgress');
            
            if (!document.getElementById('fileInput').files.length) {
                showAlert('Please select files to upload', 'warning');
                return;
            }
            
            // Show progress
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            progressContainer.style.display = 'block';
            
            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                xhr: function() {
                    const xhr = new window.XMLHttpRequest();
                    xhr.upload.addEventListener('progress', function(evt) {
                        if (evt.lengthComputable) {
                            const percentComplete = (evt.loaded / evt.total) * 100;
                            $('.progress-bar').css('width', percentComplete + '%');
                        }
                    }, false);
                    return xhr;
                },
                success: function(response) {
                    if (response.success) {
                        showAlert(response.message, 'success');
                        hideModal('uploadModal');
                        loadFiles();
                    } else {
                        showAlert(response.message, 'danger');
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.message : 'Upload failed';
                    showAlert(error, 'danger');
                },
                complete: function() {
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Files';
                    progressContainer.style.display = 'none';
                    $('.progress-bar').css('width', '0%');
                }
            });
        }

        function loadFiles() {
            $.get('/files')
                .done(function(response) {
                    if (response.success) {
                        displayFiles(response.files);
                    } else {
                        showAlert('Failed to load files', 'danger');
                    }
                })
                .fail(function() {
                    showAlert('Failed to load files', 'danger');
                });
        }

        function displayFiles(files) {
            const container = document.getElementById('filesContainer');
            
            if (files.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-inbox"></i>
                        <p class="mb-0">No files uploaded yet</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            files.forEach(file => {
                const statusClass = `status-${file.status}`;
                const statusIcon = getStatusIcon(file.status);
                
                html += `
                    <div class="file-item">
                        <div class="row align-items-start">
                            <div class="col-md-8">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="fas fa-file-alt me-2"></i>
                                    <strong>${file.filename}</strong>
                                    <span class="badge ${statusClass} ms-2">
                                        ${statusIcon} ${file.status.toUpperCase()}
                                    </span>
                                </div>
                                
                                <div class="row text-muted small">
                                    <div class="col-sm-6">
                                        <i class="fas fa-user"></i> ${file.uploaded_by}
                                    </div>
                                    <div class="col-sm-6">
                                        <i class="fas fa-calendar"></i> ${file.uploaded_at}
                                    </div>
                                    <div class="col-sm-6">
                                        <i class="fas fa-hdd"></i> ${file.file_size_str}
                                    </div>
                                    ${file.approved_by ? `
                                        <div class="col-sm-6">
                                            <i class="fas fa-check-circle"></i> ${file.approved_by}
                                        </div>
                                    ` : ''}
                                </div>
                                
                                ${file.comments ? `
                                    <div class="comments-section mt-2">
                                        <small class="text-muted"><strong>Comments:</strong></small><br>
                                        <small>${file.comments}</small>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="col-md-4">
                                <div class="action-buttons">
                                    <button type="button" class="btn btn-outline-primary btn-sm" 
                                            onclick="downloadFile(${file.id})">
                                        <i class="fas fa-download"></i> Download
                                    </button>
                                    
                                    ${file.status === 'pending' ? `
                                        <button type="button" class="btn btn-success btn-sm" 
                                                onclick="openActionModal(${file.id}, 'approve', '${file.filename}')">
                                            <i class="fas fa-check-circle"></i> Approve
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm" 
                                                onclick="openActionModal(${file.id}, 'reject', '${file.filename}')">
                                            <i class="fas fa-times-circle"></i> Reject
                                        </button>
                                    ` : ''}
                                    
                                    <button type="button" class="btn btn-outline-danger btn-sm" 
                                            onclick="deleteFile(${file.id})" 
                                            title="Delete file">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'approved': return '<i class="fas fa-check-circle"></i>';
                case 'rejected': return '<i class="fas fa-times-circle"></i>';
                default: return '<i class="fas fa-clock"></i>';
            }
        }

        function downloadFile(fileId) {
            window.open(`/download/${fileId}`, '_blank');
        }

        function openActionModal(fileId, action, filename) {
            document.getElementById('actionFileId').value = fileId;
            document.getElementById('actionType').value = action;
            
            const title = action === 'approve' ? 'Approve File' : 'Reject File';
            const btnClass = action === 'approve' ? 'btn-success' : 'btn-danger';
            const btnText = action === 'approve' ? 'Approve' : 'Reject';
            const icon = action === 'approve' ? 'fas fa-check' : 'fas fa-times';
            
            document.getElementById('actionModalTitle').innerHTML = `<i class="${icon}"></i> ${title}: ${filename}`;
            document.getElementById('actionSubmitBtn').className = `btn ${btnClass}`;
            document.getElementById('actionSubmitBtn').textContent = btnText;
            
            // Update help text
            const helpText = action === 'approve' ? 
                'Comments are optional for approval.' : 
                'Please provide a reason for rejection.';
            document.getElementById('commentsHelp').textContent = helpText;
            
            // Clear form
            document.getElementById('actionForm').reset();
            document.getElementById('actionFileId').value = fileId;
            document.getElementById('actionType').value = action;
            
            showModal('actionModal');
        }

        function submitAction() {
            const fileId = document.getElementById('actionFileId').value;
            const action = document.getElementById('actionType').value;
            const comments = document.getElementById('actionComments').value;
            
            if (action === 'reject' && !comments.trim()) {
                showAlert('Please provide a reason for rejection', 'warning');
                return;
            }
            
            const url = action === 'approve' ? `/approve/${fileId}` : `/reject/${fileId}`;
            const data = {
                comments: comments.trim()
            };
            
            $.ajax({
                url: url,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    if (response.success) {
                        showAlert(response.message, 'success');
                        hideModal('actionModal');
                        loadFiles();
                    } else {
                        showAlert(response.message, 'danger');
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.message : 'Action failed';
                    showAlert(error, 'danger');
                }
            });
        }

        function deleteFile(fileId) {
            if (confirm('Are you sure you want to delete this file? This action cannot be undone.')) {
                $.ajax({
                    url: `/delete/${fileId}`,
                    method: 'DELETE',
                    success: function(response) {
                        if (response.success) {
                            showAlert(response.message, 'success');
                            loadFiles();
                        } else {
                            showAlert(response.message, 'danger');
                        }
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON ? xhr.responseJSON.message : 'Delete failed';
                        showAlert(error, 'danger');
                    }
                });
            }
        }

        function formatFileSize(bytes) {
            for (let unit of ['B', 'KB', 'MB', 'GB']) {
                if (bytes < 1024.0) {
                    return `${bytes.toFixed(1)} ${unit}`;
                }
                bytes /= 1024.0;
            }
            return `${bytes.toFixed(1)} TB`;
        }

        function showAlert(message, type) {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" onclick="$(this).closest('.alert').remove()"></button>
                </div>
            `;
            
            $('#alertContainer').html(alertHtml);
            
            // Auto-dismiss after 5 seconds
            setTimeout(function() {
                $('.alert').fadeOut();
            }, 5000);
        }
    </script>
</body>
</html>
